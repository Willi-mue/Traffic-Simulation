[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-sim"
version = "1.1.0"
description = "Grid-based traffic simulation with PySide6"
readme = "README.md"
authors = [{ name = "Willi Müller" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
traffic-sim = "traffic_sim.__main__:main"

[tool.setuptools.packages.find]
include = ["traffic_sim*"]

[tool.setuptools.package-data]
traffic_sim = ["assets/ui/*", "maps/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["N802"]  # Qt event handlers are camelCase (paintEvent, keyPressEvent, ...)
